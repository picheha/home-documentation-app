name: Check Documentation app
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test updates and private serving
        run: python -m unittest discover -s tests -v
      - name: Build app image for this runner
        run: docker build -t documentation-app:test documentation
