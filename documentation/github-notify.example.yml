name: Notify Documentation apps

on:
  workflow_run:
    workflows: ["Build private documentation"]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.path == '.github/workflows/build-docs.yml'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
      MQTT_HOST: ${{ vars.DOCS_MQTT_HOST }}
      MQTT_PORT: ${{ vars.DOCS_MQTT_PORT || '8883' }}
      MQTT_TOPIC: ${{ vars.DOCS_MQTT_TOPIC || 'piche/documentation/ready' }}
      MQTT_USERNAME: ${{ secrets.DOCS_MQTT_USERNAME }}
      MQTT_PASSWORD: ${{ secrets.DOCS_MQTT_PASSWORD }}
    steps:
      - name: Install MQTT publishing client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y mosquitto-clients
      - name: Announce the completed documentation build
        shell: bash
        run: |
          if [[ -z "$MQTT_HOST" || -z "$MQTT_USERNAME" || -z "$MQTT_PASSWORD" ]]; then
            echo "::error::Set DOCS_MQTT_HOST, DOCS_MQTT_USERNAME and DOCS_MQTT_PASSWORD."
            exit 1
          fi
          for delay in 0 3 10; do
            sleep "$delay"
            if timeout 15s mosquitto_pub --cafile /etc/ssl/certs/ca-certificates.crt \
              -h "$MQTT_HOST" -p "$MQTT_PORT" -u "$MQTT_USERNAME" -P "$MQTT_PASSWORD" \
              -t "$MQTT_TOPIC" -m "$BUILD_RUN_ID" -q 1 -r; then
              exit 0
            fi
          done
          exit 1

