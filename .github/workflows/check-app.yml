name: Check Documentation app
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the sidebar installer test dependency
        run: python -m pip install ruamel.yaml==0.19.1
      - name: Test updates and private serving
        run: python -m unittest discover -s tests -v
      - name: Test Home Assistant theme synchronization
        run: node --test tests/test_theme.cjs tests/test_language.cjs
      - name: Create public installer test artifact
        id: api_fixture
        uses: actions/upload-artifact@v7
        with:
          name: installer-api-smoke-test
          path: documentation/waiting.html
          retention-days: 1
      - name: Verify real authenticated GitHub artifact download
        env:
          TEST_REPOSITORY: ${{ github.repository }}
          TEST_GITHUB_TOKEN: ${{ github.token }}
          TEST_ARTIFACT_ID: ${{ steps.api_fixture.outputs.artifact-id }}
          TEST_ARTIFACT_DIGEST: ${{ steps.api_fixture.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import hashlib
          import importlib.util
          import io
          import json
          import os
          from urllib.error import HTTPError
          import zipfile

          spec = importlib.util.spec_from_file_location('app', 'documentation/app.py')
          app = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(app)
          client = app.GitHub(os.environ['TEST_REPOSITORY'], os.environ['TEST_GITHUB_TOKEN'])
          original_open = client.api_opener.open
          def diagnostic_open(request, *args, **kwargs):
              try:
                  return original_open(request, *args, **kwargs)
              except HTTPError as error:
                  if error.code != 302:
                      print('GitHub API HTTP status:', error.code)
                      print('Required permissions:', error.headers.get('X-Accepted-GitHub-Permissions', 'not supplied'))
                      try:
                          print('GitHub diagnostic:', json.loads(error.read()).get('message', 'No message'))
                      except ValueError:
                          pass
                  raise
          client.api_opener.open = diagnostic_open
          artifact_id = int(os.environ['TEST_ARTIFACT_ID'])
          data = client.api(f'/actions/artifacts/{artifact_id}/zip', binary=True)
          expected = os.environ['TEST_ARTIFACT_DIGEST'].removeprefix('sha256:')
          assert hashlib.sha256(data).hexdigest() == expected
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              assert 'waiting.html' in archive.namelist()
          print('Real GitHub artifact API redirect, ZIP download and checksum verified.')
          PY
      - name: Build app image for this runner
        run: docker build -t documentation-app:test documentation
